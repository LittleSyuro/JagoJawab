<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Latih Soal SMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#f3f6fa; --grid:#e3e9f2; --card:#ffffff; --ink:#15203a; --muted:#56637d; --line:#d5dce8;
  --mat:#2f4fd8; --mat-soft:#e6ebff; --ipa:#0b8566; --ipa-soft:#dcf3ea;
  --hl:#ffd23f; --hl-ink:#3b2f00; --ok:#16864a; --ok-soft:#dcf2e4; --bad:#c9372c; --bad-soft:#fbe3e0;
  --acc:var(--mat); --acc-soft:var(--mat-soft);
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
body[data-mapel="ipa"]{--acc:var(--ipa); --acc-soft:var(--ipa-soft);}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  padding-inline:16px; padding-block:0 32px; min-height:100vh;
}
.wrap{max-width:880px; margin:0 auto}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl); outline-offset:2px}
h1,h2,h3{font-family:var(--display); line-height:1.15; text-wrap:balance; margin:0}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:18px 14px}
.brand{display:flex; align-items:baseline; gap:10px}
.brand h1{font-size:1.6rem; font-weight:800; letter-spacing:-.02em}
.brand h1 .x{background:linear-gradient(transparent 58%,var(--hl) 58%); padding-inline:2px}
.brand small{color:var(--muted); font-size:.85rem}
.tabs{display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px}
.tabs button{border:0; background:transparent; padding:7px 16px; border-radius:999px; font-weight:700; color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper)}

.sheet{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px}
.step{display:grid; gap:12px; padding-block:18px; border-top:1px dashed var(--line)}
.step:first-child{border-top:0; padding-top:0}
.label{font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

input[type=text],input[type=password]{width:100%; max-width:360px; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px; background:var(--paper)}
input[type=text]:focus,input[type=password]:focus{border-color:var(--acc); outline:none}
.err{color:var(--bad); font-size:.9rem}

.seg{display:inline-flex; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:10px 18px; font-weight:700; color:var(--muted); border-right:1.5px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc); color:#fff}
body[data-mapel] .seg.mapel button[data-v="mat"][aria-pressed="true"]{background:var(--mat)}
body[data-mapel] .seg.mapel button[data-v="ipa"][aria-pressed="true"]{background:var(--ipa)}
.hint{color:var(--muted); font-size:.9rem}

.group{display:grid; gap:8px}
.group-head{display:flex; align-items:center; justify-content:space-between; gap:8px}
.group-head h3{font-size:1rem; font-weight:600}
.linkbtn{border:0; background:none; color:var(--acc); font-weight:700; font-size:.88rem; padding:4px 0; text-decoration:underline; text-underline-offset:3px}
.chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px}
.chip{display:flex; align-items:center; gap:10px; text-align:left; border:1.5px solid var(--line); background:var(--paper); border-radius:10px; padding:10px 12px; font-weight:700; font-size:.95rem}
.chip .box{flex:none; width:20px; height:20px; border-radius:5px; border:2px solid var(--line); display:grid; place-items:center; font-size:13px; color:transparent}
.chip[aria-pressed="true"]{border-color:var(--acc); background:var(--acc-soft)}
.chip[aria-pressed="true"] .box{background:var(--acc); border-color:var(--acc); color:#fff}

.startbar{position:sticky; bottom:0; margin-top:16px; padding-bottom:env(safe-area-inset-bottom,0px); z-index:5}
.startbar .in{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--ink); color:var(--paper); border-radius:14px; padding:12px 12px 12px 18px; box-shadow:0 8px 24px rgba(10,20,40,.18)}
.startbar .sum{font-size:.95rem}
.startbar .sum b{font-family:var(--mono)}
.btn{border:0; border-radius:10px; padding:12px 22px; font-weight:700; font-size:1rem}
.btn.primary{background:var(--hl); color:var(--hl-ink)}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink)}
.btn.acc{background:var(--acc); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* quiz */
.qhead{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.qmeta{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.82rem; font-weight:700; background:var(--acc-soft); color:var(--acc)}
.pill.k{background:var(--paper); color:var(--muted); border:1px solid var(--line)}
.timer{font-family:var(--mono); font-weight:700; font-size:1.1rem; padding:6px 12px; border-radius:10px; background:var(--card); border:1.5px solid var(--line); font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--bad); color:var(--bad)}
.progress{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:16px}
.progress i{display:block; height:100%; background:var(--acc); transition:width .3s}
.qnum{font-family:var(--mono); color:var(--muted); font-size:.9rem}
.qtext{font-size:1.25rem; line-height:1.5; margin:8px 0 18px; font-weight:400}
.opts{display:grid; gap:10px}
.opt{display:flex; align-items:flex-start; gap:12px; text-align:left; width:100%; border:1.5px solid var(--line); background:var(--paper); border-radius:12px; padding:12px 14px; font-size:1.05rem}
.opt .key{flex:none; width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-family:var(--mono); font-weight:700; background:var(--card); border:1.5px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc); background:var(--acc-soft)}
.opt.sel .key{background:var(--acc); color:#fff; border-color:var(--acc)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .key{background:var(--ok); border-color:var(--ok); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad); border-color:var(--bad); color:#fff}
.opt:disabled{cursor:default}
.explain{margin-top:16px; border-radius:12px; padding:14px 16px; background:var(--paper); border:1.5px dashed var(--line)}
.explain b.v{display:block; margin-bottom:4px}
.explain.ok b.v{color:var(--ok)} .explain.no b.v{color:var(--bad)}
.qfoot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px}
.navgrid{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px}
.navgrid button{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper); font-family:var(--mono); font-size:.85rem}
.navgrid button.done{background:var(--acc-soft); border-color:var(--acc); color:var(--acc); font-weight:700}
.navgrid button.cur{outline:2px solid var(--ink); outline-offset:1px}
.confirm{margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--hl); color:var(--hl-ink); display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.confirm .btn{padding:8px 14px}
.confirm .btn.ghost{border-color:var(--hl-ink); color:var(--hl-ink)}
.kbd{font-size:.8rem; color:var(--muted)}

/* result */
.score{display:grid; grid-template-columns:auto auto 1fr; gap:20px; align-items:center}
.big{font-family:var(--mono); font-weight:700; font-size:4.2rem; line-height:1; letter-spacing:-.04em}
.big small{font-size:1.2rem; color:var(--muted); letter-spacing:0}
.verdict h2{font-size:1.5rem; font-weight:800}
.stats{display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--muted); margin-top:6px}
.stats b{color:var(--ink); font-family:var(--mono)}
.bars{display:grid; gap:10px}
.bar{display:grid; grid-template-columns:minmax(120px,1fr) 2fr auto; gap:10px; align-items:center; font-size:.92rem}
.bar .track{height:10px; background:var(--line); border-radius:99px; overflow:hidden}
.bar .track i{display:block; height:100%; border-radius:99px}
.bar .n{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--muted); min-width:56px; text-align:right}
.review{display:grid; gap:10px}
.rv{border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--paper)}
.rv.ok{border-left:5px solid var(--ok)} .rv.no{border-left:5px solid var(--bad)}
.rv .q{font-weight:700}
.rv .a{font-size:.92rem; margin-top:4px}
.rv .a .good{color:var(--ok); font-weight:700} .rv .a .badt{color:var(--bad); font-weight:700; text-decoration:line-through}
.rv .e{font-size:.9rem; color:var(--muted); margin-top:4px}
.filter{display:flex; gap:6px; flex-wrap:wrap}

/* rekap */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.tile{border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--paper)}
.tile .v{font-family:var(--mono); font-weight:700; font-size:1.7rem; font-variant-numeric:tabular-nums}
.tile .t{font-size:.82rem; color:var(--muted)}
.tablewrap{overflow-x:auto; border:1.5px solid var(--line); border-radius:12px}
table{border-collapse:collapse; width:100%; min-width:620px; font-size:.92rem}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:.75rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); background:var(--paper)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.grade{display:inline-block; min-width:44px; text-align:center; padding:2px 8px; border-radius:6px; font-family:var(--mono); font-weight:700}
.g-hi{background:var(--ok-soft); color:var(--ok)} .g-mid{background:var(--hl); color:var(--hl-ink)} .g-lo{background:var(--bad-soft); color:var(--bad)}
.tag{font-size:.78rem; font-weight:700; padding:2px 8px; border-radius:99px}
.tag.mat{background:var(--mat-soft); color:var(--mat)} .tag.ipa{background:var(--ipa-soft); color:var(--ipa)}
.del{border:0; background:none; color:var(--muted); text-decoration:underline; font-size:.85rem}
.del.arm{color:var(--bad); font-weight:700}
.empty{padding:28px; text-align:center; color:var(--muted); border:1.5px dashed var(--line); border-radius:12px}
.note{font-size:.85rem; color:var(--muted)}
.sec{display:grid; gap:12px; margin-top:22px}
.sec h2{font-size:1.15rem; font-weight:600}
select{padding:9px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper)}

/* ilustrasi soal */
.fig{margin:0 0 18px; display:flex; justify-content:center; padding:10px; border-radius:12px; background:var(--paper); border:1px solid var(--line)}
.fig svg{width:100%; max-width:360px; height:auto; overflow:visible}
.fig.kecil{margin:8px 0 4px; padding:6px}
.fig.kecil svg{max-width:220px}
.fig text,.hias svg text,.badge svg text{font-family:var(--mono); font-size:13px; font-weight:700; fill:var(--ink)}
.fig text.m{fill:var(--muted); font-weight:500; font-size:11px}
.fig text.sm{font-size:10.5px}
.fig .s,.hias .s,.badge .s,.empty-art .s{fill:none; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.fig .thin,.hias .thin,.empty-art .thin{stroke-width:1.3}
.fig .thick{stroke-width:3}
.fig .shade{stroke:var(--muted); stroke-width:5; opacity:.55}
.fig .a,.hias .a,.badge .a,.empty-art .a{fill:var(--acc-soft); stroke:var(--acc); stroke-width:2; stroke-linejoin:round}
.fig .a.top{fill:color-mix(in srgb,var(--acc-soft) 70%,var(--card))}
.fig .a.side{fill:color-mix(in srgb,var(--acc-soft) 70%,var(--acc) 12%)}
.badge .a.side{fill:color-mix(in srgb,var(--acc-soft) 70%,var(--acc) 12%)}
.fig .a.tebal{stroke-width:4.5}
.fig .b{fill:var(--card); stroke:var(--ink); stroke-width:1.5}
.fig .c{fill:var(--paper); stroke:var(--ink); stroke-width:1.5}
.fig .d{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:5 4}
.hias .d{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:4 4}
.fig .h,.hias .h,.badge .h,.empty-art .h{fill:var(--hl); stroke:var(--ink); stroke-width:1.8; stroke-linejoin:round}
.fig .h.sun{stroke:#e0a800}
.fig .g{stroke:var(--grid); stroke-width:1}
.fig .ax{stroke:var(--muted); stroke-width:1.5}
.fig .ink,.badge .ink,.empty-art .ink{fill:var(--ink)}
.fig .dot{fill:var(--acc); stroke:var(--card); stroke-width:2}
.fig .leaf,.hias .leafy,.badge .leafy{fill:#7fd19b; stroke:#1f7a45; stroke-width:1.8}
.fig .shade:not(line){fill:var(--muted); stroke:none; opacity:.18}
.fig .grass{stroke:#2e9e57; stroke-width:2; stroke-linecap:round}
.fig .soilO{fill:#4a2f18} .fig .soilA{fill:#6f4a2a} .fig .soilB{fill:#a0703f} .fig .soilC{fill:#c9a174} .fig .soilR{fill:#8b8f96}
.fig .pebble{fill:#8b8f96; stroke:#5d6168; stroke-width:1}
.fig .lead{stroke:var(--muted)}
.fig .tagc{fill:var(--hl); stroke:var(--ink); stroke-width:1.5}
.fig .heart{fill:#f6c9c4; stroke:#b8433a; stroke-width:2}
.fig .vessel{fill:none; stroke:#b8433a; stroke-width:9; stroke-linecap:round; opacity:.75}
.hias .bg{fill:var(--card); stroke:var(--acc); stroke-width:1.5}
.hias .bub{fill:var(--card); stroke:var(--acc); stroke-width:1.2}
.hias .sym{font-family:var(--display); font-size:22px; font-weight:800; fill:var(--acc)}
.hias .big-sym{font-family:var(--display); font-size:34px; font-weight:800; fill:var(--ink)}
.badge .spark{fill:var(--hl); stroke:var(--ink); stroke-width:1.2}

/* hiasan */
.hero{display:flex; align-items:center; gap:16px; padding:6px 0 18px}
.hero-art{flex:none; width:150px; padding:8px 10px; border-radius:14px; background:var(--acc-soft)}
.hero-art svg{display:block; width:100%; height:auto}
.hero h2{font-size:1.45rem; font-weight:800}
.hero p{margin:4px 0 0}
.rule{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:var(--paper); border:1.5px dashed var(--line); font-size:.9rem; color:var(--muted)}
.rule b{color:var(--bad)}
.badge{width:104px; height:104px; display:grid; place-items:center; animation:popin .5s cubic-bezier(.2,1.6,.4,1) both}
.badge svg{width:100%; height:100%}
.badge-emo{font-size:4.2rem; line-height:1}
.empty-art svg{width:140px; height:auto; display:block; margin:0 auto 10px}
.flag{font-size:.78rem; color:var(--bad); font-weight:700}
td.catatan{white-space:normal; min-width:220px}

/* beranda */
.home{display:grid; gap:18px; padding-bottom:24px}
.sapa h2{font-size:1.7rem; font-weight:800; letter-spacing:-.01em}
.sapa p{margin:4px 0 0}
.sapa .linkbtn{font-size:.85rem; color:var(--muted); margin-left:4px}
.mapel-cards{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mapel-card{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:14px; border-radius:18px; border:2px solid var(--line); background:var(--card); text-align:left; transition:transform .15s, border-color .15s, box-shadow .15s}
.mapel-card .mc-art{width:100%; max-width:150px; padding:8px; border-radius:12px; background:var(--paper)}
.mapel-card .mc-art svg{display:block; width:100%; height:auto}
.mapel-card .mc-t{font-family:var(--display); font-size:1.2rem; font-weight:800}
.mapel-card.mat{--acc:var(--mat); --acc-soft:var(--mat-soft)}
.mapel-card.ipa{--acc:var(--ipa); --acc-soft:var(--ipa-soft)}
.mapel-card[aria-pressed="true"]{border-color:var(--acc); background:var(--acc-soft); box-shadow:0 4px 0 var(--acc)}
.mapel-card[aria-pressed="true"] .mc-t{color:var(--acc)}
.mapel-card[aria-pressed="true"] .mc-art{background:var(--card)}
.mapel-card:active{transform:translateY(2px)}
.kelas-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.kelas-tabs button{flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:8px 16px; font-weight:700}
.kelas-tabs button[aria-selected="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.topik-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
.topik{display:flex; align-items:center; gap:12px; text-align:left; padding:12px 14px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); box-shadow:0 3px 0 var(--line); transition:transform .12s, box-shadow .12s, border-color .12s}
.topik:hover{border-color:var(--acc)}
.topik:active{transform:translateY(3px); box-shadow:0 0 0 var(--line)}
.ikon{flex:none; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-size:1.6rem; background:var(--acc-soft)}
.ikon.big{width:56px; height:56px; font-size:1.9rem}
.tk{display:grid; gap:3px; min-width:0; flex:1}
.tn{font-weight:700; line-height:1.3}
.tb{font-size:.8rem; color:var(--muted)}
.tb i{font-style:normal}
.pk-hi{color:var(--ok)} .pk-mid{color:#a57f00} .pk-lo{color:var(--bad)}
.tp{height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.tp i{display:block; height:100%; border-radius:99px; background:var(--acc)}
.topik.campur{background:var(--ink); color:var(--paper); border-color:var(--ink); box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 60%,black)}
.topik.campur .ikon{background:var(--hl)}
.topik.campur .tb{color:color-mix(in srgb,var(--paper) 75%,transparent)}
/* sambutan */
.welcome{text-align:center; display:grid; gap:10px; justify-items:center; padding:28px 20px}
.welcome-art{display:flex; gap:10px}
.welcome-art svg{width:120px; height:auto; padding:8px; border-radius:14px; background:var(--mat-soft)}
.welcome-art svg+svg{background:var(--ipa-soft)}
.welcome h2{font-size:1.6rem; font-weight:800}
.nama-form{display:grid; gap:10px; width:100%; max-width:340px; margin-top:8px; text-align:left}
.nama-form input{max-width:none}
/* panel bawah */
.backdrop{position:fixed; inset:0; background:rgba(10,18,35,.45); z-index:20; animation:fade .2s ease}
.bsheet{position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(560px,100%); z-index:21; background:var(--card); border-radius:22px 22px 0 0; padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px)); display:grid; gap:14px; box-shadow:0 -10px 40px rgba(10,20,40,.25); animation:sheetup .28s cubic-bezier(.2,.9,.3,1)}
.grip{width:44px; height:5px; border-radius:99px; background:var(--line); justify-self:center}
.sh-head{display:flex; align-items:center; gap:12px}
.sh-head h3{font-size:1.2rem; font-weight:800}
.sh-head>div{flex:1; min-width:0}
.x{border:0; background:var(--paper); width:36px; height:36px; border-radius:50%; color:var(--muted); font-size:1rem}
.pilih2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opsi{display:grid; gap:2px; justify-items:start; text-align:left; padding:12px; border-radius:14px; border:2px solid var(--line); background:var(--paper)}
.opsi .oe{font-size:1.5rem}
.opsi small{color:var(--muted); font-size:.8rem; line-height:1.35}
.opsi[aria-pressed="true"]{border-color:var(--acc); background:var(--acc-soft)}
.jml{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.rule-mini{margin:0; font-size:.82rem; color:var(--muted)}
.btn.wide{width:100%; padding:15px; font-size:1.05rem; box-shadow:0 4px 0 #c9a200}
.btn.wide:active{transform:translateY(3px); box-shadow:none}
@keyframes fade{from{opacity:0}}
@keyframes sheetup{from{transform:translate(-50%,100%)}}

/* umpan balik ala Duolingo */
.fb{display:flex; gap:14px; align-items:flex-start; margin-top:16px; padding:14px 16px; border-radius:14px; border:2px solid}
.fb.ok{background:var(--ok-soft); border-color:var(--ok)}
.fb.no{background:var(--bad-soft); border-color:var(--bad)}
.fb-emo{font-size:2.6rem; line-height:1; flex:none}
.fb.anim .fb-emo{animation:popin .55s cubic-bezier(.2,1.6,.4,1) both}
.fb.no.anim .fb-emo{animation:wobble .6s ease both}
.fb.anim{animation:slideup .35s ease-out both}
.fb .v{display:block; font-family:var(--display); font-size:1.25rem; font-weight:800}
.fb.ok .v{color:var(--ok)} .fb.no .v{color:var(--bad)}
.fb .v2{display:block; margin-top:2px}
.fb p{margin:6px 0 0; color:var(--ink)}
.streak{display:inline-block; margin-top:4px; padding:2px 10px; border-radius:99px; background:var(--hl); color:var(--hl-ink); font-weight:700; font-size:.88rem}
.streak.mini{margin:0 0 0 6px; font-size:.8rem; padding:1px 8px}
.opts.anim .opt.right{animation:pulse .5s ease}
.opts.anim .opt.wrong{animation:shake .45s ease}
.burst{position:fixed; z-index:50; pointer-events:none; font-size:22px; transform:translate(-50%,-50%); animation:burst 1s ease-out forwards}
.sound{border:1.5px solid var(--line); background:var(--card); border-radius:10px; width:40px; height:38px; font-size:1.1rem; line-height:1}
.warn{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; padding:12px 14px; border-radius:12px; background:var(--bad-soft); border:2px solid var(--bad); animation:shake .45s ease}
.warn span:nth-child(2){flex:1 1 220px}
.warn-emo{font-size:1.6rem}
@keyframes popin{0%{transform:scale(.2) rotate(-12deg); opacity:0}100%{transform:scale(1) rotate(0); opacity:1}}
@keyframes wobble{0%{transform:scale(.4)}40%{transform:scale(1.1) rotate(-10deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}100%{transform:none}}
@keyframes slideup{from{transform:translateY(10px); opacity:0}to{transform:none; opacity:1}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes burst{0%{opacity:1; transform:translate(-50%,-50%) scale(.6)}100%{opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.1)}}

@media (max-width:560px){
  .hero{gap:12px}
  .hero-art{width:110px}
  .hero h2{font-size:1.2rem}
  .badge{width:84px; height:84px}
  .qtext{font-size:1.12rem}
  .score{grid-template-columns:auto 1fr; gap:14px}
  .score .verdict{grid-column:1 / -1}
  .big{font-size:3.4rem}
  .bar{grid-template-columns:1fr auto; }
  .bar .track{grid-column:1 / -1; grid-row:2}
  .sheet{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

<script>
/* ============ helpers ============ */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const F=n=>{const v=Math.round(n*100)/100;return (Object.is(v,-0)?0:v).toLocaleString('id-ID',{maximumFractionDigits:2})};
const fr=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d};
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup=n=>String(n).split('').map(c=>SUP[c]).join('');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lin(a,b,v='x'){let s='';if(a!==0)s=(a===1?'':a===-1?'-':a)+v;if(b!==0)s+=s?(b>0?' + '+b:' - '+(-b)):String(b);return s||'0'}
function sg(c,v,first){if(c===0)return '';const abs=Math.abs(c);const co=(abs===1&&v)?'':abs;if(first)return (c<0?'-':'')+co+v;return (c<0?' - ':' + ')+co+v}
function quad(a,b,c,v='x'){return sg(a,v+'²',true)+sg(b,v)+sg(c,'')}
function num(ans,c,u='',p=''){const A=p+F(ans)+u;const s=new Set();for(const x of c){if(x==null||!isFinite(x))continue;const v=p+F(x)+u;if(v!==A)s.add(v);if(s.size===3)break}
  let k=1;const step=Math.max(1,Math.round(Math.abs(ans)/10));while(s.size<3){const v=p+F(ans+(k%2?1:-1)*Math.ceil(k/2)*step)+u;if(v!==A)s.add(v);k++}return{a:A,d:[...s]}}
function so(a,c,fill){const s=new Set();for(const x of c){if(x!=null&&x!==a)s.add(x);if(s.size===3)break}let g=0;while(s.size<3&&g<80){const x=fill();if(x!==a)s.add(x);g++}return{a,d:[...s]}}
const mk=(q,o,e,img)=>({q,a:o.a,d:o.d,e,img});
const rp=n=>'Rp'+F(n);

/* ============ ilustrasi (SVG, warna ikut tema) ============ */
const F1=n=>Math.round(n*10)/10;
const svg=(w,h,body,label)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${body}</svg>`;
const tx=(x,y,s,a='middle',c='')=>`<text x="${F1(x)}" y="${F1(y)}" text-anchor="${a}"${c?` class="${c}"`:''}>${esc(s)}</text>`;
const ln=(x1,y1,x2,y2,c='s')=>`<line class="${c}" x1="${F1(x1)}" y1="${F1(y1)}" x2="${F1(x2)}" y2="${F1(y2)}"/>`;
const pg=(pts,c='a')=>`<polygon class="${c}" points="${pts.map(p=>p.map(F1).join(',')).join(' ')}"/>`;
const cc=(x,y,r,c='a')=>`<circle class="${c}" cx="${F1(x)}" cy="${F1(y)}" r="${F1(r)}"/>`;
const siku=(x,y,dx,dy,s=10)=>`<path class="s thin" d="M${x+dx*s} ${y} L${x+dx*s} ${y+dy*s} L${x} ${y+dy*s}"/>`;
const pt=(cx,cy,r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];
const arc=(cx,cy,r,a1,a2,c='s thin')=>{const [x1,y1]=pt(cx,cy,r,a1),[x2,y2]=pt(cx,cy,r,a2);return `<path class="${c}" d="M${F1(x1)} ${F1(y1)} A${r} ${r} 0 ${a2-a1>180?1:0} 0 ${F1(x2)} ${F1(y2)}"/>`};
const panah=(x1,y1,x2,y2)=>{const a=Math.atan2(y2-y1,x2-x1),h=8;return ln(x1,y1,x2,y2)+pg([[x2,y2],[x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45)],[x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45)]],'ink')};
// bangun ruang: kotak miring (kubus/balok)
function kotak(w,h,dx,dy,x0,y0){const X=x0+w,Y=y0+h,B=[x0+dx,Y-dy];
  return pg([[x0,y0],[x0+dx,y0-dy],[X+dx,y0-dy],[X,y0]],'a top')+pg([[X,y0],[X+dx,y0-dy],[X+dx,Y-dy],[X,Y]],'a side')+`<rect class="a" x="${x0}" y="${y0}" width="${w}" height="${h}"/>`+ln(B[0],B[1],x0,Y,'d')+ln(B[0],B[1],x0+dx,y0-dy,'d')+ln(B[0],B[1],X+dx,Y-dy,'d')}
const FG={
  persegipanjang(p,l,u='cm'){const w=200,h=Math.max(50,Math.min(120,w*l/p));return svg(320,h+50,`<rect class="a" x="60" y="12" width="${w}" height="${h}"/>`+tx(160,h+36,`${p} ${u}`)+tx(52,12+h/2+4,`${l} ${u}`,'end'),`Persegi panjang ${p} kali ${l} ${u}`)},
  segitiga(a,t,u='cm'){return svg(320,180,pg([[120,30],[50,150],[270,150]])+ln(120,30,120,150,'d')+siku(120,150,1,-1)+tx(160,172,`${a} ${u}`)+tx(127,96,`${t} ${u}`,'start'),`Segitiga dengan alas ${a} ${u} dan tinggi ${t} ${u}`)},
  trapesium(a,b,t,u='cm'){const W=Math.max(70,240*a/b);return svg(320,185,pg([[80,35],[80+W,35],[280,150],[40,150]])+ln(80,35,80,150,'d')+siku(80,150,1,-1)+tx(80+W/2,25,`${a} ${u}`)+tx(160,172,`${b} ${u}`)+tx(87,97,`${t} ${u}`,'start'),`Trapesium dengan sisi sejajar ${a} dan ${b} ${u}`)},
  persegi(L,u='cm'){return svg(320,185,`<rect class="a" x="95" y="15" width="130" height="130"/>`+tx(160,85,`L = ${L} ${u}²`)+tx(160,168,'s = ?'),`Persegi dengan luas ${L} ${u} persegi`)},
  jajargenjang(a,t,s,u='cm'){return svg(320,180,pg([[40,145],[220,145],[280,40],[100,40]])+ln(100,40,100,145,'d')+siku(100,145,1,-1)+tx(130,167,`${a} ${u}`)+tx(107,98,`${t} ${u}`,'start')+tx(258,98,`${s} ${u}`,'start'),'Jajargenjang')},
  siku(la,lb,lc){return svg(320,200,pg([[70,22],[70,168],[270,168]])+siku(70,168,1,-1,12)+tx(62,100,la,'end')+tx(170,190,lb)+tx(180,88,lc,'start'),'Segitiga siku-siku')},
  tangga(c,a,u='m'){let r='';for(let i=1;i<8;i++){const x=110+140*i/8,y=170-130*i/8;r+=ln(x-5,y-4,x+5,y+4,'s thin')}
    return svg(320,200,ln(250,12,250,170,'s thick')+ln(30,170,292,170,'s thick')+ln(105,166,245,36)+ln(115,174,255,44)+r+ln(264,40,264,170,'d')+tx(270,110,'?','start')+tx(180,190,`${a} ${u}`)+tx(160,94,`${c} ${u}`,'end'),'Tangga bersandar pada dinding')},
  lingkaran({r,d,th,u='cm'}){const cx=160,cy=100,R=78;let b='';
    if(th){const [x2,y2]=pt(cx,cy,R,th),[lx,ly]=pt(cx,cy,34,th/2);b+=cc(cx,cy,R,'s')+`<path class="a" d="M${cx} ${cy} L${cx+R} ${cy} A${R} ${R} 0 ${th>180?1:0} 0 ${F1(x2)} ${F1(y2)} Z"/>`+arc(cx,cy,18,0,th)+tx(lx,ly+4,th+'°')}
    else b+=cc(cx,cy,R);
    if(d)b+=ln(cx-R,cy,cx+R,cy)+tx(cx,cy-9,`d = ${d} ${u}`);
    else if(r&&!th)b+=ln(cx,cy,cx+R,cy)+tx(cx+R/2,cy-9,`r = ${r} ${u}`);
    else if(r)b+=tx(cx+R/2,cy+20,`r = ${r} ${u}`);
    return svg(320,200,b+cc(cx,cy,3,'ink'),'Lingkaran')},
  kubus(s,u='cm'){return svg(320,210,kotak(110,110,55,40,70,70)+tx(125,202,`${s} ${u}`),`Kubus dengan rusuk ${s} ${u}`)},
  balok(p,l,t,u='cm'){return svg(320,200,kotak(150,85,55,40,50,75)+tx(125,180,`${p} ${u}`)+tx(42,122,`${t} ${u}`,'end')+tx(236,152,`${l} ${u}`,'start'),`Balok ${p} kali ${l} kali ${t} ${u}`)},
  limas(s,t,u='cm'){const A=[165,22],fl=[70,172],fr=[210,172],br=[262,130],bl=[122,130],c=[166,151];
    return svg(320,200,pg([A,fl,fr])+pg([A,fr,br],'a side')+ln(...bl,...fl,'d')+ln(...bl,...br,'d')+ln(...A,...bl,'d')+ln(...A,...c,'d')+cc(...c,2.5,'ink')+tx(140,192,`${s} ${u}`)+tx(172,100,`${t} ${u}`,'start'),`Limas persegi dengan sisi alas ${s} ${u} dan tinggi ${t} ${u}`)},
  tabung(r,t,u='cm'){return svg(320,205,`<path class="a" d="M90 40 L90 165 A70 18 0 0 0 230 165 L230 40 Z"/><path class="d" d="M90 165 A70 18 0 0 1 230 165"/><ellipse class="a top" cx="160" cy="40" rx="70" ry="18"/>`+ln(160,40,230,40)+cc(160,40,2.5,'ink')+tx(195,33,`r = ${r} ${u}`)+tx(238,108,`t = ${t} ${u}`,'start'),`Tabung dengan jari-jari ${r} ${u} dan tinggi ${t} ${u}`)},
  kerucut(r,t,u='cm',s=null){return svg(320,205,`<path class="a" d="M80 168 L160 25 L240 168 A80 20 0 0 1 80 168 Z"/><path class="d" d="M80 168 A80 20 0 0 1 240 168"/>`+ln(160,25,160,168,'d')+ln(160,168,240,168)+cc(160,168,2.5,'ink')+tx(200,161,`r = ${r} ${u}`)+tx(154,105,`t = ${t} ${u}`,'end')+(s?tx(208,92,`s = ${s}`,'start'):''),`Kerucut dengan jari-jari ${r} ${u} dan tinggi ${t} ${u}`)},
  bola(r,u='cm'){return svg(320,200,cc(160,100,80)+`<path class="d" d="M80 100 A80 22 0 0 1 240 100"/><path class="s thin" d="M80 100 A80 22 0 0 0 240 100"/>`+ln(160,100,240,100)+cc(160,100,2.5,'ink')+tx(200,93,`r = ${r} ${u}`),`Bola dengan jari-jari ${r} ${u}`)},
  kue(sl,hi){const cx=160,cy=100,R=82;let a=90,b='',lab='';const cls=['b','a','c','b','a'];
    sl.forEach((s,i)=>{const a2=a-s.v,[x1,y1]=pt(cx,cy,R,a),[x2,y2]=pt(cx,cy,R,a2),m=(a+a2)/2,far=s.v<40;
      b+=`<path class="${i===hi?'h':cls[i%cls.length]}" d="M${cx} ${cy} L${F1(x1)} ${F1(y1)} A${R} ${R} 0 ${s.v>180?1:0} 1 ${F1(x2)} ${F1(y2)} Z"/>`;
      const [lx,ly]=pt(cx,cy,far?R+20:R*.6,m),an=far?(lx<cx-4?'end':lx>cx+4?'start':'middle'):'middle';
      lab+=tx(lx,ly-(s.lab?2:-4),s.n,an,'m')+(s.lab?tx(lx,ly+12,s.lab,an):'');a=a2});
    return svg(320,200,b+lab,'Diagram lingkaran')},
  batang(lb,vs,u=''){const mx=Math.max(...vs),n=vs.length,W=250/n;let b=ln(40,165,300,165,'ax');
    [0,.5,1].forEach(f=>{const y=165-130*f;b+=ln(40,y,300,y,'g')+tx(34,y+4,F(Math.round(mx*f)),'end','m')});
    vs.forEach((v,i)=>{const h=130*v/mx,x=44+i*W+W*.18,w=W*.64;b+=`<rect class="a" x="${F1(x)}" y="${F1(165-h)}" width="${F1(w)}" height="${F1(h)}" rx="3"/>`+tx(x+w/2,160-h,v)+tx(x+w/2,182,lb[i],'middle','m')});
    return svg(320,195,b,'Diagram batang')},
  pelurus(x){const [px,py]=pt(160,140,115,x),[l1x,l1y]=pt(160,140,40,x/2),[l2x,l2y]=pt(160,140,46,(x+180)/2);
    return svg(320,165,ln(40,140,280,140)+ln(160,140,px,py)+arc(160,140,28,0,x)+arc(160,140,34,x,180)+tx(l1x,l1y+4,x+'°')+tx(l2x,l2y+4,'?'),`Dua sudut berpelurus, salah satunya ${x} derajat`)},
  penyiku(x){const [px,py]=pt(90,160,130,x),[l1x,l1y]=pt(90,160,48,x/2),[l2x,l2y]=pt(90,160,52,(x+90)/2);
    return svg(320,180,ln(90,160,280,160)+ln(90,160,90,25)+ln(90,160,px,py)+siku(90,160,1,-1,12)+arc(90,160,34,0,x)+arc(90,160,40,x,90)+tx(l1x+6,l1y+4,x+'°')+tx(l2x,l2y+4,'?'),`Dua sudut berpenyiku, salah satunya ${x} derajat`)},
  sudutSegitiga(a,b){const C=180-a-b,r=Math.PI/180,AC=Math.sin(b*r)/Math.sin(C*r);let P=[[0,0],[1,0],[AC*Math.cos(a*r),-AC*Math.sin(a*r)]];
    const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),k=Math.min(240/(Math.max(...xs)-Math.min(...xs)),130/(Math.max(...ys)-Math.min(...ys)));
    P=P.map(([x,y])=>[40+(x-Math.min(...xs))*k,160+y*k]);const g=[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
    const lab=(p,s)=>{const d=Math.hypot(g[0]-p[0],g[1]-p[1]),q=[p[0]+(g[0]-p[0])/d*30,p[1]+(g[1]-p[1])/d*30];return tx(q[0],q[1]+4,s)};
    return svg(320,180,pg(P)+lab(P[0],a+'°')+lab(P[1],b+'°')+lab(P[2],'?'),`Segitiga dengan sudut ${a} dan ${b} derajat`)},
  bertolak(e1,e2){const [a1,b1]=pt(160,95,120,30),[a2,b2]=pt(160,95,120,210),[a3,b3]=pt(160,95,120,150),[a4,b4]=pt(160,95,120,330);
    return svg(320,190,ln(a2,b2,a1,b1)+ln(a4,b4,a3,b3)+arc(160,95,24,30,150)+arc(160,95,24,210,330)+tx(160,52,e1)+tx(160,150,e2)+cc(160,95,3,'ink'),'Dua garis berpotongan')},
  koordinat(ps,garis=false){const m=Math.max(6,...ps.flatMap(p=>[Math.abs(p.x),Math.abs(p.y)]))+1,k=105/m,O=[160,118],X=x=>O[0]+x*k,Y=y=>O[1]-y*k;let b='';
    for(let i=-m;i<=m;i++){b+=ln(X(i),Y(-m),X(i),Y(m),'g')+ln(X(-m),Y(i),X(m),Y(i),'g')}
    b+=ln(X(-m),O[1],X(m),O[1],'ax')+ln(O[0],Y(-m),O[0],Y(m),'ax')+tx(X(m)+6,O[1]+4,'x','start','m')+tx(O[0],Y(m)-6,'y','middle','m')+tx(O[0]-4,O[1]+12,'0','end','m');
    if(garis&&ps.length===2)b+=ln(X(ps[0].x),Y(ps[0].y),X(ps[1].x),Y(ps[1].y),'d');
    ps.forEach(p=>{b+=cc(X(p.x),Y(p.y),4.5,'dot')+tx(X(p.x)+7,Y(p.y)-7,p.n||'','start')});
    return svg(320,240,b,'Bidang koordinat')},
  bayangan(t1,b1,h,b2,u='m'){const k=Math.min(28,130/h,215/(b1+b2)),G=170,x0=40,x1=x0+b1*k+34;
    return svg(320,195,ln(20,G,305,G,'s thick')+cc(300,26,13,'h')+ln(x0,G,x0,G-t1*k,'s thick')+ln(x0,G,x0+b1*k,G,'s shade')+ln(x0,G-t1*k,x0+b1*k,G,'d')
      +ln(x1,G,x1,G-h*k+14,'s thick')+cc(x1,G-h*k+14,14,'a leaf')+ln(x1,G,x1+b2*k,G,'s shade')+ln(x1,G-h*k,x1+b2*k,G,'d')
      +tx(x0-6,G-t1*k/2,`${F(t1)} ${u}`,'end')+tx(x0+b1*k/2,G+18,`${F(b1)} ${u}`)+tx(x1-8,G-h*k/2,'?','end')+tx(x1+b2*k/2,G+18,`${b2} ${u}`),'Tongkat dan pohon beserta bayangannya')},
  foto(w,h,W){const k=Math.min(18,110/(h*W/w),150/W);const w1=w*k*.9,h1=h*k*.9,w2=W*k,h2=h*W/w*k;

function bagi(sisa,n,step){const out=[];for(let i=n-1;i>0;i--){const maks=Math.floor((sisa-step*i)/step);const v=step*R(1,Math.max(1,Math.min(maks,Math.round(sisa/step/(i+1))+1)));out.push(v);sisa-=v}out.push(sisa);return shuffle(out)}

topic('bulat','mat',7,'Bilangan Bulat',()=>{const t=R(0,3);
  if(t===0){const a=R(-20,20),b=R(-9,-2),c=R(2,6),ans=a-b*c;return mk(`Hasil dari ${a} - (${b}) × ${c} adalah …`,num(ans,[(a-b)*c,a+b*c,-ans]),`Kerjakan perkalian lebih dulu: (${b}) × ${c} = ${b*c}. Lalu ${a} - (${b*c}) = ${ans}.`)}
  if(t===1){const a=R(-12,-2),b=R(4,15),ans=a+b;return mk(`Suhu di puncak gunung pada pagi hari ${a}°C. Menjelang siang suhu naik ${b}°C. Suhu pada siang hari adalah …`,num(ans,[a-b,-a+b,-(a+b)],'°C'),`${a} + ${b} = ${ans}, jadi suhu siang hari ${ans}°C.`)}
  if(t===2){const a=R(-15,-2),b=R(-12,-2),ans=a*b;return mk(`Hasil dari (${a}) × (${b}) adalah …`,num(ans,[-ans,a+b,ans+a]),`Negatif dikali negatif hasilnya positif: ${-a} × ${-b} = ${ans}.`)}
  const b=R(2,9),q=R(-12,-2),a=b*q;return mk(`Hasil dari (${a}) : ${b} adalah …`,num(q,[-q,a-b,q-1]),`Negatif dibagi positif hasilnya negatif: ${-a} : ${b} = ${-q}, jadi hasilnya ${q}.`)});

topic('pecahan','mat',7,'Pecahan & Persen',()=>{const t=R(0,3);const D=[2,3,4,5,6,8,10,12];

  if(t===1){const q=pick([3,4,5,8]);let p=R(1,q-1);while(gcd(p,q)>1)p=R(1,q-1);const N=q*R(4,30),ans=N/q*p;
    return mk(`${p}/${q} dari ${N} adalah …`,num(ans,[N/p,N-ans,N/q]),`${N} : ${q} = ${N/q}, lalu × ${p} = ${ans}.`)}
  if(t===2){const b=pick(D),d=pick(D),a=R(1,b-1),c=R(1,d-1);
    return mk(`Hasil dari ${a}/${b} × ${c}/${d} adalah …`,so(fr(a*c,b*d),[fr(a*d,b*c),fr(a+c,b+d),fr(a*c,b+d)],()=>fr(a*c+R(1,4),b*d)),`Kalikan pembilang dengan pembilang dan penyebut dengan penyebut: ${a*c}/${b*d} = ${fr(a*c,b*d)}.`)}
  const v=R(1,99);return mk(`Bentuk persen dari ${F(v/100)} adalah …`,so(v+'%',[F(v/10)+'%',v*10+'%',F(v/100)+'%'],()=>R(1,99)+'%'),`Kalikan dengan 100%: ${F(v/100)} × 100% = ${v}%.`)});

topic('aljabar','mat',7,'Bentuk Aljabar',()=>{const t=R(0,3);

    return mk(`Bentuk sederhana dari ${a}x + ${b} ${c<0?'- '+(-c):'+ '+c}x - ${d} adalah …`,so(lin(a+c,b-d),[lin(a-c,b-d),lin(a+c,b+d),lin(a+c,d-b)],()=>lin(a+c+R(-3,3),b-d+R(-3,3))),`Kumpulkan suku sejenis: (${a} ${c<0?'- '+(-c):'+ '+c})x + (${b} - ${d}) = ${lin(a+c,b-d)}.`)}

function buildQuestions(ids,count){
  const used=new Set(),out=[],pools={};ids.forEach(id=>pools[id]=shuffle(TOPIC[id].s));
  let order=[],guard=0;
  while(out.length<count&&guard<count*40){guard++;
    if(!order.length)order=shuffle(ids);const id=order.pop(),tp=TOPIC[id];let item=null;
    const useStatic=pools[id].length&&(!tp.gen||Math.random()<.55);
    if(useStatic){const s=pools[id].pop();item={q:s[0],a:s[1],d:[s[2],s[3],s[4]],e:s[5]}}
    else if(tp.gen){item=tp.gen()}
    if(!item||used.has(item.q+(item.img||'')))continue;used.add(item.q+(item.img||''));
    const opts=shuffle([item.a,...item.d]);out.push({t:id,q:item.q,o:opts,ans:opts.indexOf(item.a),e:item.e,img:item.img});
  }
  return out;
}

let db=null,records=[],storeMode='memuat';
const LKEY='latihsoal-hasil',NKEY='latihsoal-nama';
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
function loadLocal(){try{records=JSON.parse(ls.get(LKEY)||'[]')}catch{records=[]}records.sort((a,b)=>b.waktu<a.waktu?-1:1)}
function saveLocal(){ls.set(LKEY,JSON.stringify(records.filter(r=>r._local)))}

/* server Netlify (/api/hasil): nilai dari semua perangkat terkumpul di satu tempat */
const API='/api/hasil';let apiOk=false;
async function loadServer(){
  try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;const list=await r.json();
    apiOk=true;storeMode='server';
    records=[...list,...records.filter(x=>x._local)].sort((a,b)=>b.waktu<a.waktu?-1:1);refresh();return true}
  catch{return false}
}
async function syncLocal(){ // kirim nilai yang sempat tersimpan lokal saat offline
  const pend=records.filter(r=>r._local);if(!pend.length)return;
  for(const r of pend){const{_local,id,...rec}=r;try{const x=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});if(x.ok){records=records.filter(y=>y!==r)}}catch{return}}
  saveLocal();await loadServer();
}
(async()=>{
  if(await loadServer()){await syncLocal();setInterval(()=>{if(S.screen==='rekap')loadServer()},20000);return}
  try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null)}catch{db=null}
  if(!db){storeMode='lokal';refresh();return}
  storeMode='db';
  try{
    db.collection('hasil').orderBy('waktu','desc').limit(500).onSnapshot(s=>{
      const local=records.filter(r=>r._local);
      records=[...s.docs.map(d=>({id:d.id,...d.data()})),...local].sort((a,b)=>b.waktu<a.waktu?-1:1);refresh();
    },()=>{storeMode='lokal';refresh()});
  }catch{storeMode='lokal'}
  refresh();
})();
async function saveRecord(rec){
  if(apiOk){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});
    if(r.ok){const{id}=await r.json();records.unshift({...rec,id});return true}}catch(e){}}
  if(db&&storeMode==='db'){try{await db.collection('hasil').add(rec);return true}catch(e){}}
  rec._local=true;rec.id='L'+Date.now();records.unshift(rec);saveLocal();return false;
}
async function deleteRecord(r){
  if(r._local){records=records.filter(x=>x!==r);saveLocal();refresh();return}
  if(apiOk){try{const x=await fetch(API+'?id='+encodeURIComponent(r.id),{method:'DELETE'});if(x.ok){records=records.filter(y=>y!==r);refresh()}}catch{}return}
  try{await db.doc('hasil/'+r.id).delete()}catch{}
}

    ${rs.length?`<div class="sec"><div class="tiles">
      <div class="tile"><div class="v">${rs.length}</div><div class="t">kali latihan</div></div>
      <div class="tile"><div class="v">${avg}</div><div class="t">rata-rata nilai</div></div>
      <div class="tile"><div class="v">${best}</div><div class="t">nilai tertinggi</div></div>
      <div class="tile"><div class="v">${soal}</div><div class="t">soal dikerjakan</div></div></div></div>
    ${weak?`<div class="sec"><h2>Topik yang perlu diulang</h2><span class="hint">Diurutkan dari persentase benar terendah (minimal 3 soal).</span><div class="bars">${weak}</div></div>`:''}
    <div class="sec"><div class="row" style="justify-content:space-between"><h2>Riwayat</h2><button class="del ${S.armed==='__all'?'arm':''}" id="resetAll">${S.armed==='__all'?`Yakin hapus ${rs.length} nilai? Klik lagi`:`Reset nilai${S.rekapName!=='semua'?' '+esc(S.rekapName):''}${S.rekapMapel!=='semua'?' '+MAPEL[S.rekapMapel]:''}`}</button></div><div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Nama</th><th>Mapel</th><th>Mode</th><th>Nilai</th><th>Benar</th><th>Durasi</th><th>Catatan</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`
    :`<div class="sec"><div class="empty">${storeMode==='memuat'?'':`<div class="empty-art">${KOSONG}</div>`}${storeMode==='memuat'?'Memuat rekap…':'Belum ada nilai tercatat. Selesaikan satu latihan, nilainya akan muncul di sini.'}<div style="margin-top:12px"><button class="btn acc" data-go="home">Mulai latihan</button></div></div></div>`}
  </section>`;
}

/* ============ events ============ */
document.addEventListener('click',e=>{const b=e.target.closest('button');
  if(e.target.dataset.pinclose || (b && b.dataset.pinclose)){S.pinModal=false;S.pinErr='';render();return}
  if(b && b.id==='lockRekap'){sessionStorage.removeItem('rekap_pin_ok');S.screen='home';S.armed=null;render();window.scrollTo(0,0);return}
  if(!b)return;
  if(b.dataset.go){
    if(S.screen==='quiz'&&b.dataset.go!=='quiz'){ if(!confirmLeave())return }
    if(b.dataset.go==='rekap'&&!isAuthed()){ S.pinModal=true; S.pinErr=''; render(); return }
    S.screen=b.dataset.go;S.armed=null;render();window.scrollTo(0,0);return
  }
  if(S.screen==='home'){
    if(b.dataset.close){S.sheet=null;render();return}
    if(b.id==='gantiNama'){S.gantiNama=true;render();return}
    if(b.dataset.topic){const t=TOPIC[b.dataset.topic];return bukaSheet([t.id],t.n,IKON[t.id]||'📘',t.k?`${KELAS(t.k)} · Bab ${t.b}`:'Materi tambahan')}
    if(b.dataset.mix){const k=S.kelas??7,ts=T.filter(t=>t.m===S.mapel&&t.k===k);return bukaSheet(ts.map(t=>t.id),'Campur semua topik','🎯',`${KELAS(k)} · ${ts.length} topik`)}
    if(b.dataset.kelas){S.kelas=+b.dataset.kelas;ls.set('latihsoal-kelas',S.kelas);render();return}
    if(b.dataset.mapel){S.mapel=b.dataset.mapel;ls.set('latihsoal-mapel',S.mapel);render();return}
    if(b.dataset.mode){S.mode=b.dataset.mode;render();return}
    if(b.dataset.count){S.count=+b.dataset.count;render();return}
    if(b.id==='start')return startQuiz();
  }
  if(S.screen==='quiz'){
    if(b.dataset.opt)return answer(+b.dataset.opt);
    if(b.id==='tutupWarn'){Z.warn=0;render();return}
    if(b.id==='suara'){suaraOn=!suaraOn;ls.set('latihsoal-suara',suaraOn?'1':'0');render();if(suaraOn)bunyi(true);return}
    if(b.id==='next'){if(Z.i<Z.qs.length-1){Z.i++;render();window.scrollTo(0,0)}else finish();return}
    if(b.id==='endEarly')return finish();
    if(b.id==='prev'){Z.i--;Z.confirm=false;render();return}
    if(b.id==='nextU'){Z.i++;Z.confirm=false;render();return}
    if(b.dataset.jump){Z.i=+b.dataset.jump;Z.confirm=false;render();return}
    if(b.id==='submit'){Z.confirm=true;render();return}
    if(b.id==='cancelSubmit'){Z.confirm=false;render();return}
    if(b.id==='doSubmit')return finish();
  }
  if(S.screen==='result'){
    if(b.dataset.rf){Z.result.filter=b.dataset.rf;render();return}
    if(b.id==='again'){S.mapel=Z.mapel;S.mode=Z.mode;S.sheet={ids:Z.topics};return startQuiz()}
    if(b.id==='home'){S.screen='home';render();window.scrollTo(0,0);return}
  }
  if(S.screen==='rekap'&&b.id==='resetAll'){if(S.armed!=='__all'){S.armed='__all';render();return}
    S.armed=null;const rs=records.filter(r=>(S.rekapName==='semua'||r.nama===S.rekapName)&&(S.rekapMapel==='semua'||r.mapel===S.rekapMapel));
    (async()=>{for(const r of rs)await deleteRecord(r);if(apiOk)await loadServer();render()})();return}
  if(S.screen==='rekap'&&b.dataset.del){const id=b.dataset.del;if(S.armed===id){const r=records.find(x=>x.id===id);S.armed=null;if(r)deleteRecord(r);render()}else{S.armed=id;render()}return}
});
let leaveArmed=false;
function confirmLeave(){if(leaveArmed){leaveArmed=false;clearInterval(timerId);if(aktif()){const rec=recNol('Meninggalkan latihan sebelum selesai');Z.saved=true;saveRecord(rec)}Z=null;return true}
  leaveArmed=true;const f=app.querySelector('.qfoot');if(f&&!document.getElementById('leaveNote')){const n=document.createElement('div');n.className='confirm';n.id='leaveNote';n.innerHTML=`<span>Latihan belum selesai. Kalau keluar sekarang, nilainya dicatat <b>0</b>. ${Z&&Z.mode==='latihan'?'Pakai tombol <b>Akhiri latihan</b> untuk menyimpan nilai soal yang sudah dijawab. ':''}Klik tab sekali lagi untuk tetap keluar.</span>`;f.after(n)}
  setTimeout(()=>{leaveArmed=false},5000);return false}
document.addEventListener('change',e=>{if(e.target.id==='rkName'){S.rekapName=e.target.value;render()}if(e.target.id==='rkMapel'){S.rekapMapel=e.target.value;render()}});
document.addEventListener('submit',e=>{
  if(e.target.id==='fPin'){
    e.preventDefault();
    const v=(document.getElementById('pinInput')?.value||'').trim();
    if(v===ADMIN_PIN){
      sessionStorage.setItem('rekap_pin_ok','1');
      S.pinModal=false;
      S.pinErr='';
      S.screen='rekap';
      render();
      window.scrollTo(0,0);
    }else{
      S.pinErr='PIN salah. Akses khusus Mas Syuro.';
      render();
      const inp=document.getElementById('pinInput');
      if(inp){inp.focus();inp.select()}
    }
    return;
  }
  if(e.target.id!=='fNama')return;
  e.preventDefault();const v=document.getElementById('nama').value.trim();if(!v)return;
  S.name=v;S.gantiNama=false;ls.set(NKEY,v);render();window.scrollTo(0,0);
});
document.addEventListener('click',e=>{
  if(S.pinModal&&e.target.classList.contains('backdrop')){S.pinModal=false;S.pinErr='';render();return}
  if(S.screen==='home'&&S.sheet&&e.target.classList.contains('backdrop')){S.sheet=null;render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.pinModal){S.pinModal=false;S.pinErr='';render();return}
    if(S.screen==='home'&&S.sheet){S.sheet=null;render();return}
  }
});
document.addEventListener('keydown',e=>{if(S.screen!=='quiz'||e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  const map={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};
  if(k in map&&!(Z.mode==='latihan'&&Z.ansr[Z.i]!==null)){answer(map[k]);return}
  if(e.key==='Enter'){const n=document.getElementById('next')||document.getElementById('nextU');if(n){e.preventDefault();n.click()}}
});
render();
</script>
